DATASET: mlg-ulb/creditcardfraud
OUTPUT_DIR: data/raw

models:
  baseline:
    max_iter: 1000
    class_weight: balanced
  
  mlp:
    threshold: 0.3
    hidden_size: 64
    output_size: 1
    epochs: 5
    batch_size: 256
    lr: 0.001
    dropout: 0.2

  xgb:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    reg_alpha: 0.0
    reg_lambda: 1.0
    n_jobs: -1
    random_state: 42
    

training:
  test_size: 0.2
  random_state: 42
  stratify: true