dataset:
  name: mlg-ulb/creditcardfraud
  output_dir: data/raw

training:
  test_size: 0.2
  random_state: 42
  stratify: true
  cv_folds: 5
  scoring: pr_auc

tuning:
  n_trials: 30
  timeout: 600
  direction: maximize

models:
  baseline:
    fixed:
      class_weight: balanced
    search:
      max_iter:
        type: int
        low: 500
        high: 2000
        step: 250

  mlp:
    fixed:
      output_size: 1
      epochs: 5
      batch_size: 256
      weight_decay: 0.0
      optimizer: adam
      use_scaler: true
    search:
      hidden_size:
        type: int
        low: 32
        high: 256
        step: 32
      dropout:
        type: float
        low: 0.0
        high: 0.5
      lr:
        type: float
        low: 1.0e-4
        high: 1.0e-2
        log: true
      threshold:
        type: float
        low: 0.1
        high: 0.9

  xgb:
    fixed:
      n_jobs: -1
      random_state: 42
      eval_metric: auc
    search:
      n_estimators:
        type: int
        low: 50
        high: 300
        step: 50
      max_depth:
        type: int
        low: 3
        high: 10
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      subsample:
        type: float
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: float
        low: 0.6
        high: 1.0
      min_child_weight:
        type: int
        low: 1
        high: 10
      reg_alpha:
        type: float
        low: 0.0
        high: 1.0
      reg_lambda:
        type: float
        low: 0.0
        high: 5.0

  random_forest:
    fixed:
      n_jobs: -1
      random_state: 42
      class_weight: balanced
    search:
      n_estimators:
        type: int
        low: 100
        high: 500
        step: 100
      max_depth:
        type: int
        low: 5
        high: 25
      min_samples_split:
        type: int
        low: 2
        high: 20
      min_samples_leaf:
        type: int
        low: 1
        high: 10
      max_features:
        type: categorical
        choices: [sqrt, log2]